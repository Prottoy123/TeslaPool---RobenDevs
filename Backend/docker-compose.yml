version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: teslapool_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: teslapool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teslapool"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teslapool_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/teslapool?schema=public"
      JWT_SECRET: "dhaka-tesla-pool-super-secret-jwt-key-2026"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    command: >
      sh -c "npx prisma db push && node prisma/seed.js && node src/server.js"

volumes:
  postgres_data:
